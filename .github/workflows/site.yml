name: Website

# Copies the original website with all its scripts (animations, 3D, menus), debrands it
# (tools/site_runtime.js), adds German and publishes it together with the launcher feed
# (release_info.json) on the gh-pages branch, which GitHub Pages serves at
# https://artcraft.labtoso.de/ (the custom domain; labtoso.github.io/Artcraft redirects there).

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * *"
  push:
    branches: [main]
    paths: ["tools/site.py", "tools/site_runtime.js", "tools/capture.js", "tools/collect.js", "site/**", ".github/workflows/site.yml"]

permissions:
  contents: write
  issues: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  UPSTREAM: storytold
  ARTCRAFT_REPO: ${{ github.repository }}
  ARTCRAFT_SITE: https://artcraft.labtoso.de

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Copy the original website
        timeout-minutes: 20
        run: node tools/capture.js raw
      - name: Debrand
        run: python3 -u tools/site.py build --raw raw --out _site
      - name: German
        timeout-minutes: 25
        run: |
          python3 -m http.server 8000 --directory _site >/dev/null 2>&1 &
          sleep 2
          node tools/collect.js _site "http://localhost:8000$(python3 -c 'import os,urllib.parse;print(urllib.parse.urlparse(os.environ["ARTCRAFT_SITE"]).path.rstrip("/"))')" texts.json
          python3 -u tools/site.py translate --texts texts.json --out _site
      - name: Keep new German texts
        run: |
          git config user.name "Labtoso"
          git config user.email "235880825+Labtoso@users.noreply.github.com"
          git add site/i18n/de.auto.json
          if ! git diff --cached --quiet; then
            git commit -m "Website: German for new texts"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin HEAD:main && break
              sleep $((i * 5))
            done
          fi
      - name: Publish to gh-pages
        run: |
          git fetch origin gh-pages || true
          git worktree add -B gh-pages _pages origin/gh-pages 2>/dev/null || git worktree add --orphan -b gh-pages _pages
          find _pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "_site/$(python3 -c 'import os,urllib.parse;print(urllib.parse.urlparse(os.environ["ARTCRAFT_SITE"]).path.strip("/"))')/." _pages/
          cd _pages
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Website update $(date -u +%Y-%m-%d)"
            git push origin gh-pages
          fi

      - name: Custom domain and HTTPS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          host=$(python3 -c 'import os,urllib.parse;print(urllib.parse.urlparse(os.environ["ARTCRAFT_SITE"]).hostname)')
          case "$host" in *.github.io) exit 0;; esac
          gh api -X PUT "repos/$GITHUB_REPOSITORY/pages" -f cname="$host" -F https_enforced=true || echo "::warning title=Pages::could not set HTTPS yet (the certificate may still be on its way)"
          gh api "repos/$GITHUB_REPOSITORY/pages" --jq '"domain \(.cname), https \(.https_enforced), certificate \(.https_certificate.state // "none")"' | sed 's/^/::notice title=Pages::/' || true
      # installed launchers must find the feed, also the ones from before the custom domain
      - name: Check the launcher feed
        run: |
          sleep 60
          for url in "$ARTCRAFT_SITE/release_info.json" "https://labtoso.github.io/Artcraft/release_info.json"; do
            res=$(curl -sSL -o feed.json -w '%{http_code} %{url_effective}' "$url" || true)
            launcher=$(python3 -c 'import json;print(json.load(open("feed.json"))["release_info"]["apps"]["artcraft-launcher"]["latest_release"]["tag"])' 2>/dev/null || echo "unreadable")
            echo "::notice title=Feed::$url -> $res, launcher $launcher"
          done

  notify:
    needs: build
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Website update failed $(date -u +%Y-%m-%d)"
          body="The website mirror could not be updated. The last published version stays online; it is retried daily.

          Run: $RUN"
          gh issue create --assignee Labtoso --title "$title" --body "$body" || gh issue create --title "$title" --body "$body"

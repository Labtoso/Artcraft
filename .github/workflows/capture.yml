name: Website capture

# Saves the original website with every file a browser loads (scripts included) into the
# draft release "site-check", for working on the mirror.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: node tools/capture.js raw
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd raw && zip -qr ../site-raw.zip . && cd .. && ls -la site-raw.zip
          gh release view site-check >/dev/null 2>&1 || gh release create site-check --draft --title "Website check" --notes "Screenshots: original vs. mirror."
          gh release upload site-check site-raw.zip --clobber

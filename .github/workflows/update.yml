name: Update apps

# Every day at 01:00 German time: find new Craft apps and new versions of the apps and the
# launcher upstream, debrand, build, publish, then copy the original website again and refresh
# the launcher feed. Runs on its own; nothing to do by hand.

on:
  schedule:
    # GitHub counts in UTC: 23:00 UTC is 01:00 in summer (CEST), 00:00 UTC is 01:00 in winter
    # (CET); the clock job lets through only the one that is 01:00 in Germany today
    - cron: "0 23 * * *"
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild anyway: all, or app ids separated by commas (e.g. wordcraft,gridcraft)"
        type: string
        default: ""
      retry:
        description: "Set by the pipeline itself when it retries a failed run"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["tools/**", "apps/*/debrand.toml", ".github/workflows/update.yml"]

permissions:
  contents: write
  issues: write
  pages: write

concurrency:
  group: update
  cancel-in-progress: false

env:
  UPSTREAM: storytold
  ARTCRAFT_REPO: ${{ github.repository }}
  ARTCRAFT_SITE: https://artcraft.labtoso.de

jobs:
  clock:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.c.outputs.go }}
    steps:
      - id: c
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          offset=$(TZ=Europe/Berlin date +%z)
          go=true
          if [ "$EVENT" = schedule ]; then
            case "$CRON:$offset" in
              "0 23 * * *:+0200" | "0 0 * * *:+0100") go=true ;;
              *) go=false ;;
            esac
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          [ "$go" = true ] || echo "::notice title=Schedule::not 01:00 in Germany for this trigger, the other one runs today"

  discover:
    needs: clock
    if: needs.clock.outputs.go == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.d.outputs.matrix }}
      any: ${{ steps.d.outputs.any }}
    steps:
      # the newest main: a queued run must see what the run before it published (state/)
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: d
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: python3 tools/discover.py
      - uses: actions/upload-artifact@v4
        with:
          name: discovered
          path: build/discovered.json

  # Debrand on Linux and prove it compiles; the result is a patch the build jobs apply.
  prepare:
    needs: discover
    if: needs.discover.outputs.any == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 14
      matrix:
        app: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: _artcraft
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM }}/${{ matrix.app.repo }}
          ref: ${{ matrix.app.tag }}
          path: src
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev \
            libxi-dev libgl1-mesa-dev libasound2-dev pkg-config libssl-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
          key: prepare-${{ matrix.app.id }}
      - name: Debrand and check
        run: python3 _artcraft/tools/prepare.py src ${{ matrix.app.id }}
      - uses: actions/upload-artifact@v4
        with:
          name: patch-${{ matrix.app.id }}
          path: |
            _artcraft/build/${{ matrix.app.id }}.patch
            _artcraft/build/${{ matrix.app.id }}.safe.patch
            _artcraft/build/${{ matrix.app.id }}.report.json

  build:
    needs: [discover, prepare]
    if: always() && needs.discover.outputs.any == 'true'
    runs-on: ${{ matrix.os.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        app: ${{ fromJson(needs.discover.outputs.matrix) }}
        os:
          - { name: windows, runner: windows-latest }
          - { name: linux, runner: ubuntu-22.04 }
          - { name: macos, runner: macos-15 }
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: --cap-lints=warn
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM }}/${{ matrix.app.repo }}
          ref: ${{ matrix.app.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: patch-${{ matrix.app.id }}
          path: _patch
      - name: Apply debranding
        shell: bash
        run: |
          if [ -s "_patch/${{ matrix.app.id }}.patch" ]; then git apply --whitespace=nowarn "_patch/${{ matrix.app.id }}.patch"; fi
          mv _patch "$RUNNER_TEMP/patch"
      - name: Check out craft-fonts
        if: matrix.app.fonts_ref != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM }}/craft-fonts
          ref: ${{ matrix.app.fonts_ref }}
          path: craft-fonts
          persist-credentials: false
      - name: Check out craft-i18n
        uses: storytold/craft-common-actions/actions/checkout-craft-i18n@main
      - uses: dtolnay/rust-toolchain@stable
        with:
          # macOS: one universal app for Apple silicon and Intel, like the original
          targets: ${{ matrix.os.name == 'macos' && 'aarch64-apple-darwin, x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: build-${{ matrix.os.name }}-${{ matrix.app.id }}
      - name: Linux packaging tools
        if: matrix.os.name == 'linux'
        uses: storytold/craft-common-actions/actions/install-linux-deps@main
      - name: WiX
        if: matrix.os.name == 'windows'
        uses: storytold/craft-common-actions/actions/install-wix@main
      - name: Build and package (Windows)
        id: win
        if: matrix.os.name == 'windows'
        continue-on-error: true
        shell: bash
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
        run: |
          pwsh -NoProfile -File packaging/windows/package.ps1 -Arch x64 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
      - name: Build and package (Linux)
        id: lin
        if: matrix.os.name == 'linux'
        continue-on-error: true
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
        run: |
          bash packaging/linux/package.sh 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
      # without Apple's signing secrets the original's script signs ad hoc (not notarized)
      - name: Build and package (macOS)
        id: mac
        if: matrix.os.name == 'macos'
        continue-on-error: true
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
        run: |
          bash packaging/macos/package.sh --arch universal 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
      # Self-repair: when the debranded build fails, build again with only the links rewritten
      # (buttons stay, but every link points here), so a new version still ships.
      - name: Fallback build with links only
        if: steps.win.outcome == 'failure' || steps.lin.outcome == 'failure' || steps.mac.outcome == 'failure'
        shell: bash
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
        run: |
          echo "::warning title=Fallback::debranded build failed, building with links rewritten only"
          cp build.log build-first.log 2>/dev/null || true
          git checkout -- .
          rm -rf dist/release vendor-craft-update
          if [ -s "$RUNNER_TEMP/patch/${{ matrix.app.id }}.safe.patch" ]; then git apply --whitespace=nowarn "$RUNNER_TEMP/patch/${{ matrix.app.id }}.safe.patch"; fi
          if [ "${{ matrix.os.name }}" = windows ]; then
            pwsh -NoProfile -File packaging/windows/package.ps1 -Arch x64 2>&1 | tee build.log
          elif [ "${{ matrix.os.name }}" = macos ]; then
            bash packaging/macos/package.sh --arch universal 2>&1 | tee build.log
          else
            bash packaging/linux/package.sh 2>&1 | tee build.log
          fi
          exit ${PIPESTATUS[0]}
      - name: Show the end of the build log
        if: failure() || steps.win.outcome == 'failure' || steps.lin.outcome == 'failure' || steps.mac.outcome == 'failure'
        shell: bash
        run: |
          log=build-first.log; [ -f "$log" ] || log=build.log
          [ -f "$log" ] || exit 0
          msg=$(tail -n 60 "$log" | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build log (last 60 lines)::$msg"
      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          find dist/release -maxdepth 1 -type f ! -name 'SHA256SUMS*' ! -name '*.sha256' -exec cp {} out/ \;
          ls -la out
      # GitHub's artifact service times out now and then: try again before giving up the build
      - uses: actions/upload-artifact@v4
        id: upload
        continue-on-error: true
        with:
          name: dist-${{ matrix.app.id }}-${{ matrix.os.name }}
          path: out/*
          if-no-files-found: error
      - name: Wait before the second upload
        if: steps.upload.outcome == 'failure'
        shell: bash
        run: sleep 60
      - uses: actions/upload-artifact@v4
        if: steps.upload.outcome == 'failure'
        with:
          name: dist-${{ matrix.app.id }}-${{ matrix.os.name }}
          path: out/*
          if-no-files-found: error
          overwrite: true

  publish:
    needs: [discover, build]
    if: always() && needs.discover.outputs.any == 'true'
    runs-on: ubuntu-latest
    steps:
      # the newest main, so state/versions.json holds everything published so far
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: discovered
          path: build
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: _dist
      - name: Sort files per app
        run: |
          mkdir -p dist
          for d in _dist/dist-*; do
            [ -d "$d" ] || continue
            name="${d#_dist/dist-}"; app="${name%-*}"
            mkdir -p "dist/$app"; cp "$d"/* "dist/$app/"
          done
          # an app counts only when Windows and Linux built; a missing macOS build is reported
          for app in $(ls dist); do
            if [ ! -d "_dist/dist-$app-windows" ] || [ ! -d "_dist/dist-$app-linux" ]; then
              echo "$app: not every platform built, keeping the previous version"; rm -rf "dist/$app"
            elif [ ! -d "_dist/dist-$app-macos" ]; then
              echo "::warning title=macOS::$app: the macOS build failed, publishing Windows and Linux only"
            fi
          done
      - name: Publish releases
        env:
          GH_TOKEN: ${{ github.token }}
          MATRIX: ${{ needs.discover.outputs.matrix }}
        run: python3 tools/publish.py
      - name: Save state and app pages
        run: |
          python3 tools/readmes.py
          git config user.name "Labtoso"
          git config user.email "235880825+Labtoso@users.noreply.github.com"
          git add state apps README.md
          if ! git diff --cached --quiet; then
            git commit -m "Update apps: $(python3 -c 'import json,os;print(", ".join(f"{m["id"]} {m["version"]}" for m in json.loads(os.environ["MATRIX"]) if os.path.isdir("dist/"+m["id"])))')"
            # other workflows (the website's German texts) push to main too: rebase and retry
            for i in 1 2 3 4 5; do
              git push && exit 0
              sleep $((i * 5))
              git pull --rebase origin main
            done
            exit 1
          fi
        env:
          MATRIX: ${{ needs.discover.outputs.matrix }}
      - name: Report failed builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s build/failed.txt ] || exit 0
          body="These apps could not be built this time, so the previous version stays online:

          $(sed 's/^/- /' build/failed.txt)

          Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh issue create --assignee Labtoso --title "Build failed: $(paste -sd, build/failed.txt)" --body "$body" || gh issue create --title "Build failed: $(paste -sd, build/failed.txt)" --body "$body" || true

  # GitHub pauses scheduled workflows in repos without activity for 60 days; a tiny commit
  # every 40 quiet days keeps the schedule alive.
  keepalive:
    needs: clock
    if: needs.clock.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 40 * 86400 )) ]; then
            git config user.name "Labtoso"
            git config user.email "235880825+Labtoso@users.noreply.github.com"
            mkdir -p state
            date -u +%Y-%m-%dT%H:%M:%SZ > state/last-check.txt
            git add state/last-check.txt
            git commit -m "Keep the update schedule active"
            git push
          fi

  # Anything red in this run (discovery, a build, publishing) opens one issue assigned to
  # Labtoso, so GitHub sends a notification by mail and in the app.
  # Self-repair: a failed run starts one fresh run right away (runners and downloads fail now and
  # then); only when that one fails too, an issue is opened.
  retry:
    needs: [discover, prepare, build, publish]
    if: failure() && inputs.retry != true
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update.yml --repo "${{ github.repository }}" --ref main -f retry=true

  notify:
    needs: [discover, prepare, build, publish, keepalive]
    if: failure() && inputs.retry == true
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Update run failed $(date -u +%Y-%m-%d)"
          body="Something in the automatic update did not work. The previous versions stay online; the next run (daily at 01:00 German time) tries again.

          Run: $RUN"
          gh issue create --assignee Labtoso --title "$title" --body "$body" || gh issue create --title "$title" --body "$body"

  site:
    needs: [clock, publish]
    if: always() && needs.clock.outputs.go == 'true'
    uses: ./.github/workflows/site.yml
    permissions:
      contents: write
      issues: write
      pages: write

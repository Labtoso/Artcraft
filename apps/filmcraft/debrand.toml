# Title bar: the Discord pill shares its block with the document title, so it is shrunk to
# nothing instead of removed (the title keeps its place).
[[replace]]
file = "crates/ui-egui/src/header.rs"
find = "let w = g.size().x + 34.0;"
with = "let w = 0.0_f32;"

[[remove]]
file = "crates/ui-egui/src/header.rs"
marker = "if resp.hovered() { t.accent_hover } else { t.accent });"

[[remove]]
file = "crates/ui-egui/src/header.rs"
marker = "Icon::Chat, Color32::WHITE);"

[[remove]]
file = "crates/ui-egui/src/header.rs"
marker = "ui.painter().galley(pos2(r.min.x + 25.0"

# Import screen: the first link used to be Discord, drawn as the highlighted one.
[[replace]]
file = "crates/ui-egui/src/panels/import_mode.rs"
find = 'let label = if primary { tl!("Join us on Discord") } else { crate::i18n::t(label) };'
with = "let label = crate::i18n::t(label);"

[[replace]]
file = "crates/ui-egui/src/panels/import_mode.rs"
find = "let primary = i == 0;"
with = "let primary = false && i == 0;"

[[replace]]
file = "crates/ui-egui/src/panels/import_mode.rs"
find = "[crate::icons::Icon::Chat, crate::icons::Icon::Globe, crate::icons::Icon::Globe, crate::icons::Icon::Code][i]"
with = "[crate::icons::Icon::Globe, crate::icons::Icon::Globe, crate::icons::Icon::Code, crate::icons::Icon::Code][i]"
